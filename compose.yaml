# Local development.
#
#   docker compose up -d --wait            Postgres only; run the engine with `go run`
#   docker compose --profile weir up       Postgres and Weir itself, built from this checkout
#
# With the second, Weir listens on http://localhost:8080 and its admin key is
# "local-admin-key". That key is for a laptop and nowhere else.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: weir
      POSTGRES_PASSWORD: weir
      POSTGRES_DB: weir
    ports:
      # An unusual host port, so it does not collide with a Postgres you already run.
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weir -d weir"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - weir-postgres:/var/lib/postgresql/data

  migrate:
    profiles: [weir]
    build: { context: ., dockerfile: deploy/Dockerfile }
    command: [migrate]
    environment: &weir-env
      WEIR_DATABASE_URL: postgres://weir:weir@postgres:5432/weir?sslmode=disable
      WEIR_ADMIN_KEY: local-admin-key
    depends_on:
      postgres: { condition: service_healthy }

  weir:
    profiles: [weir]
    build: { context: ., dockerfile: deploy/Dockerfile }
    environment: *weir-env
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  weir-postgres:
