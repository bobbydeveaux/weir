apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "weir.name" . }}
  labels: {{- include "weir.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if eq .Values.agents.runner "kubernetes" }}
---
# Leave to start an agent as a Job, watch it, read why it failed, and remove
# it. Nothing else, and only in the namespace agents run in.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "weir.name" . }}-agents
  namespace: {{ include "weir.agentNamespace" . }}
  labels: {{- include "weir.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "weir.name" . }}-agents
  namespace: {{ include "weir.agentNamespace" . }}
  labels: {{- include "weir.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "weir.name" . }}-agents
subjects:
  - kind: ServiceAccount
    name: {{ include "weir.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
