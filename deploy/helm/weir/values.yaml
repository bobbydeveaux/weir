# The Weir server: the API and a worker in one program.
image:
  repository: ghcr.io/bobbydeveaux/weir
  # The version to run. Empty means the chart's own appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# A worker polls for work, so one copy must stay up. More than one is safe:
# each step is claimed by one worker.
replicaCount: 1

# existingSecret names a Kubernetes Secret you make yourself. Every key in it
# becomes an environment variable of the server. It may be left empty when
# secretFiles.adminKey gives the admin key and the database needs no password
# (see secretFiles below). Otherwise it must hold:
#
#   WEIR_ADMIN_KEY       the key that may do anything; the server will not start without it
#   WEIR_DATABASE_URL    the Postgres database (or WEIR_DATABASE_HOST and its parts)
#
# A database that is signed in to with AWS IAM has no password, so it needs
# nothing here: its settings go in env. See "Amazon RDS with IAM" in the README.
#
# and may hold the secrets your connections name, as
# WEIR_SECRET__<WORKSPACE>__<NAME>. The chart never holds a secret itself.
existingSecret: ""

# env holds any other setting, by name. See the README for the full list.
env: {}
#  WEIR_PUBLIC_URL: https://weir.example.com

# The certificate authorities to check the database's certificate against, for
# a database whose certificate a machine does not trust by default, such as
# Amazon RDS. configMap names a ConfigMap you make yourself; key is the file in
# it. The chart mounts it and sets WEIR_DATABASE_SSLROOTCERT.
databaseCA:
  configMap: ""
  key: ca.pem

# Secret files, read by the server from a volume you describe, in place of
# (or as well as) existingSecret. The volume is copied as written into the
# pod: a Secret, a CSI volume (the Secrets Store CSI driver, with AWS, Azure,
# Google Cloud or Vault), or a projected volume. It is mounted read-only at
# mountPath in the server and the migration, and WEIR_SECRETS_DIR is set to
# it, so file: references read <mountPath>/<workspace>/<name>.
secretFiles:
  volume: {}
  #  csi:
  #    driver: secrets-store.csi.k8s.io
  #    readOnly: true
  #    volumeAttributes:
  #      secretProviderClass: weir
  mountPath: /etc/weir/secrets
  # The file at the top of the volume that holds the admin key. It sets
  # WEIR_ADMIN_KEY_FILE. A plain file name: one in a directory could be read
  # by the workspace of that name. Leave existingSecret without WEIR_ADMIN_KEY
  # when this is set: the server refuses both.
  adminKey: ""

# Bringing the database up to date with "weir migrate".
migrate:
  enabled: true
  # before: in a Job that runs before each install and upgrade. A failed
  #         migration stops the release. The Secret must already exist.
  # start:  in the server's pod, before the server starts. Choose this when
  #         something fills the Secret in after the release is installed, such
  #         as External Secrets Operator.
  when: before

# Where agents run. With "kubernetes", each agent step is a Job in this
# cluster, and the chart gives Weir's service account leave to manage Jobs.
agents:
  # inline (beside the worker) or kubernetes (a Job each).
  runner: kubernetes
  image:
    repository: ghcr.io/bobbydeveaux/weir-agent
    tag: ""
  # A Secret you make yourself, whose keys become an agent's environment: the
  # model's credential, such as CLAUDE_CODE_OAUTH_TOKEN. Weir never reads it.
  secret: ""
  # Where Jobs are made. Empty means the release's own namespace.
  namespace: ""
  # The account an agent's pod runs as, for a cloud's workload identity.
  serviceAccount: ""
  cpu: ""
  memory: ""

serviceAccount:
  # Annotations for Weir's own service account, for a cloud's workload
  # identity (to reach a bucket, for example).
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  # The name of a TLS Secret. Empty means none.
  tlsSecret: ""

resources: {}
nodeSelector: {}
tolerations: []
podAnnotations: {}
