name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: weir
          POSTGRES_PASSWORD: weir
          POSTGRES_DB: weir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weir -d weir"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      WEIR_TEST_DATABASE_URL: postgres://weir:weir@localhost:5432/weir?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -count=1 -race ./...
      - name: Helm chart
        run: helm lint deploy/helm/weir && helm template weir deploy/helm/weir --set existingSecret=weir > /dev/null

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: console/.nvmrc
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
