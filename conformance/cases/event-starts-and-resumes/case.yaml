description: An event that matches a trigger starts a run, one that does not starts nothing, and a waiting step moves on only for the event that is about its run.
steps:
  - emit: { type: order.placed, id: e-1, data: { id: A-1, total: 20 } }
  - emit: { type: order.placed, id: e-2, data: { id: A-2, total: 250 } }
  - emit: { type: order.paid, id: e-3, data: { id: A-9 } }
  - emit: { type: order.paid, id: e-4, data: { id: A-2 } }
expect:
  status: succeeded
